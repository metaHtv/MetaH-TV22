
name: Build MetaH TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract and inspect project
        run: |
          mkdir extracted
          unzip -q "MetaH-TV-v1.2.2-IBO-STYLE (1).zip" -d extracted
          echo "=== Project files ==="
          find extracted -maxdepth 5 -type f | head -200
          echo "=== Gradle files ==="
          find extracted -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Check for Gradle wrapper
        run: |
          if ! find extracted -type f -name gradlew | grep -q .; then
            echo "Gradle wrapper is missing. Inspect the file list above."
            exit 1
          fi

      - name: Build APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaH-TV-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
