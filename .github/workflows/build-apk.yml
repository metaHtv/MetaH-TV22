
name: Build MetaH TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q "MetaH-TV-v1.2.2-IBO-STYLE (1).zip" -d extracted
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          find . -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-output/MetaH-TV.apk" \;

      - uses: actions/upload-artifact@v4
        with:
          name: MetaH-TV-APK
          path: apk-output/MetaH-TV.apk
          if-no-files-found: error
